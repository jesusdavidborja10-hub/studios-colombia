<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Página no encontrada · STUDIOS COLOMBIA</title>
<link rel="icon" type="image/png" href="logo-studios-colombia-favicon.png">
<link rel="apple-touch-icon" href="logo-studios-colombia-favicon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#0B0D12;
    --text:#EDF2F7;
    --muted:#8792A3;
    --gold:#F4B942;
    --gold-rgb:244,185,66;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(circle at 15% -10%, rgba(var(--gold-rgb),0.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }
  .box{max-width:420px;}
  .logo-mark{
    height:72px;width:72px;border-radius:50%;object-fit:contain;
    box-shadow:0 0 0 2px rgba(var(--gold-rgb),0.35), 0 0 18px 2px rgba(var(--gold-rgb),0.45);
    margin-bottom:22px;
  }
  .code{font-family:'Anton',sans-serif;font-size:72px;line-height:1;color:var(--gold);margin:0;}
  h1{font-family:'Anton',sans-serif;font-weight:400;font-size:20px;margin:10px 0 10px;letter-spacing:0.2px;}
  p{color:var(--muted);font-size:14.5px;margin:0 0 28px;}
  a.btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--gold);
    color:#0B0D12;
    font-weight:800;
    font-size:14px;
    text-decoration:none;
    padding:13px 24px;
    border-radius:4px;
  }
  a.btn:hover{box-shadow:0 8px 24px rgba(var(--gold-rgb),0.4);}
</style>
</head>
<body>
  <div class="box">
    <img class="logo-mark" src="logo-studios-colombia-header.png" alt="Studios Colombia">
    <p class="code">404</p>
    <h1>Esta página no existe</h1>
    <p>El enlace puede estar mal escrito o la página ya no está disponible. Pero tranquilo, el catálogo sigue aquí esperándote.</p>
    <a class="btn" href="/">Volver a la tienda</a>
  </div>
</body>
</html>
